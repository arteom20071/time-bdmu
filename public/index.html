<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Группа 7108</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Source+Code+Pro:wght@500&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="chrome">
        <div class="chrome-top">
          <p class="group">Группа 7108</p>
          <p class="clock" id="clock">--:--</p>
        </div>
        <nav class="tabs" aria-label="Разделы">
          <button type="button" class="tab is-on" id="tab-today" data-tab="0">Сегодня</button>
          <button type="button" class="tab" id="tab-week" data-tab="1">Неделя</button>
        </nav>
      </header>

      <div class="viewport" id="viewport">
        <div class="track" id="track">
          <section class="page" id="page-today" aria-labelledby="tab-today">
            <article class="slab" id="status"></article>
            <ol class="list" id="today-list"></ol>
          </section>

          <section class="page" id="page-week" aria-labelledby="tab-week">
            <div class="week-bar">
              <button type="button" class="week-btn" id="week-prev" aria-label="Предыдущая неделя">‹</button>
              <p class="week-label" id="week-label"></p>
              <button type="button" class="week-btn" id="week-next" aria-label="Следующая неделя">›</button>
            </div>
            <div class="week-frame">
              <div class="week-track" id="week-track">
                <div class="week-stack" id="week-stack"></div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
